{% extends "base.html" %}
{% block robots %}noindex, follow{% endblock %}
{% block main %}
<div class="auth">
  <div class="art" aria-hidden="true">
    <canvas class="scene" data-scene="art"></canvas>
    <div class="quote"><span class="eyebrow">Welcome back</span><h2>Your boards<br><span class="grad-text">missed you.</span></h2></div>
  </div>
  <div class="form-side">
    <form method="post" action="/login{% if next and next != '/account' %}?next={{ next|urlencode }}{% endif %}" novalidate>
      <h1 class="h2">Sign in</h1>
      <p class="muted">No account yet? <a href="/register">Create one</a>.</p>
      {% if err %}<div class="alert err" role="alert">{{ err }}</div>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><input id="l-email" name="email" type="email" maxlength="254" placeholder=" " value="{{ email }}" required autocomplete="email" autofocus><label for="l-email">Email</label></div>
      <div class="field"><input id="l-pw" name="password" type="password" maxlength="200" placeholder=" " required autocomplete="current-password"><label for="l-pw">Password</label>
        <button class="eye" type="button" data-eye="l-pw" aria-label="Show the password">👁</button></div>
      <button class="btn btn-primary btn-lg" type="submit" data-magnetic>Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ asset('js/scene3d.js') }}"></script>{% endblock %}
